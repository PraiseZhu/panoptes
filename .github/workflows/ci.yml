name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: argus/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The real pipeline refuses to test without bubblewrap. Try to provide it; if the runner
      # cannot create user namespaces, fall back to the explicit unsandboxed mode for the test suite only.
      - name: Sandbox (bubblewrap)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap >/dev/null || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 >/dev/null 2>&1 || true
          if bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid true 2>/dev/null; then
            echo "bwrap works"
          else
            echo "bwrap unusable on this runner; tests run with ARGUS_SANDBOX=none ARGUS_ALLOW_UNSANDBOXED=1"
            echo "ARGUS_SANDBOX=none" >> "$GITHUB_ENV"
            echo "ARGUS_ALLOW_UNSANDBOXED=1" >> "$GITHUB_ENV"
          fi

      - name: Shell syntax
        run: |
          bash -n run-nightly.sh
          bash -n mini/check-queue.sh
          sh -n scripts/chromium-linux.sh
          shellcheck --version | head -2
          shellcheck run-nightly.sh mini/check-queue.sh scripts/chromium-linux.sh

      - name: Script syntax
        run: |
          for f in scripts/*.mjs; do node --check "$f"; done
          for f in report/*.mjs; do node --check "$f"; done
          node -e 'JSON.parse(require("fs").readFileSync("report/allowed-chats.example.json","utf8"))'
          python -m py_compile scripts/*.py

      # Pi line (pi/, merged in 10-24): every script compiles, every shell script parses, every pi/test/test_*.py passes
      # (no network, no model; tests that need the box's own data skip themselves)
      - name: Pi line selftest
        env:
          PI_SELFTEST_TAIL: '120'
        run: bash pi/bin/selftest.sh

      # infrafix (fix/infra-* branches) fixes panoptes itself and must never change the Pi line that runs it
      - name: infra fixes never touch pi/
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'fix/infra-')
        run: |
          git fetch -q --no-tags --unshallow origin || git fetch -q --no-tags origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E '^pi/'; then
            echo "::error::an infrafix PR (fix/infra-*) changes pi/ -- the bot may not change itself"; exit 1
          fi

      - name: argus tests
        working-directory: argus
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm ci
          npm test
